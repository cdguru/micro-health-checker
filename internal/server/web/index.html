<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="color-scheme" content="dark">
  <title>micro-health-checker</title>
  <style>
    :root{--bg:#080c14;--panel:#101722;--panel2:#141d2b;--text:#eef4ff;--muted:#8997ab;--line:#223044;--ok:#35d07f;--err:#ff6474;--unknown:#f0b44c;--accent:#73a7ff}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 80% 0,#15233d 0,transparent 35%),var(--bg);color:var(--text);font:14px/1.5 ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.wrap{width:min(1180px,calc(100% - 32px));margin:0 auto;padding:42px 0 70px}header{display:flex;align-items:flex-end;justify-content:space-between;gap:24px;margin-bottom:28px}.eyebrow{color:var(--accent);font:700 11px/1.2 ui-monospace,SFMono-Regular,Menlo,monospace;letter-spacing:.18em;text-transform:uppercase}h1{font-size:clamp(27px,5vw,44px);line-height:1.05;margin:8px 0 5px;letter-spacing:-.04em}.subtitle{color:var(--muted);margin:0}.live{display:flex;align-items:center;gap:8px;color:var(--muted);white-space:nowrap}.pulse{width:8px;height:8px;border-radius:50%;background:var(--ok);box-shadow:0 0 0 5px #35d07f1a}.summary{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:20px}.stat,.card{background:linear-gradient(145deg,#131c2aeb,#0e151feb);border:1px solid var(--line);box-shadow:0 20px 50px #0003}.stat{border-radius:14px;padding:17px 18px}.stat span{display:block;color:var(--muted);font-size:12px}.stat strong{display:block;font-size:25px;margin-top:3px}.toolbar{display:flex;align-items:center;gap:12px;margin:16px 0}.search{flex:1;background:#0d141f;border:1px solid var(--line);border-radius:10px;color:var(--text);padding:11px 13px;outline:none}.search:focus{border-color:var(--accent)}.updated{color:var(--muted);font-size:12px}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(285px,1fr));gap:14px}.card{border-radius:15px;padding:17px;position:relative;overflow:hidden}.card:before{content:"";position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--unknown)}.card.ok:before{background:var(--ok)}.card.error:before{background:var(--err)}.top{display:flex;align-items:start;justify-content:space-between;gap:16px}.name{font-weight:750;font-size:16px}.meta{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;color:var(--muted);font-size:11px;margin-top:3px}.badge{border:1px solid currentColor;border-radius:999px;padding:3px 8px;font-size:10px;font-weight:800;letter-spacing:.08em}.ok .badge{color:var(--ok)}.error .badge{color:var(--err)}.unknown .badge,.disabled .badge{color:var(--unknown)}.latency{font-size:27px;font-weight:760;letter-spacing:-.04em;margin:22px 0 2px}.latency small{font-size:12px;color:var(--muted);font-weight:500;letter-spacing:0}.details{display:flex;justify-content:space-between;color:var(--muted);font-size:11px}.error-text{color:#ff9ba6;background:#ff64740d;border:1px solid #ff647426;border-radius:8px;padding:8px;margin-top:12px;font:11px/1.4 ui-monospace,SFMono-Regular,Menlo,monospace;word-break:break-word}.empty{color:var(--muted);padding:60px 0;text-align:center;grid-column:1/-1}@media(max-width:700px){header{align-items:start;flex-direction:column}.summary{grid-template-columns:repeat(2,1fr)}.wrap{padding-top:25px}.updated{display:none}}
  </style>
</head>
<body>
  <main class="wrap">
    <header><div><div class="eyebrow">Protocol-to-REST health gateway</div><h1>micro-health-checker</h1><p class="subtitle">Real protocol checks. Simple REST signals.</p></div><div class="live"><span class="pulse"></span><span id="version">connecting…</span></div></header>
    <section class="summary"><div class="stat"><span>Total checks</span><strong id="total">–</strong></div><div class="stat"><span>Healthy</span><strong id="ok">–</strong></div><div class="stat"><span>Failing</span><strong id="error">–</strong></div><div class="stat"><span>Unknown / disabled</span><strong id="other">–</strong></div></section>
    <div class="toolbar"><input id="search" class="search" type="search" placeholder="Filter checks…" autocomplete="off"><span id="updated" class="updated"></span></div>
    <section id="grid" class="grid"><div class="empty">Loading health checks…</div></section>
  </main>
  <script>
    const grid=document.querySelector('#grid'), search=document.querySelector('#search'); let checks=[];
    const esc=v=>String(v??'').replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]));
    const age=v=>{if(!v)return'never';const s=Math.max(0,Math.floor((Date.now()-new Date(v))/1000));if(s<60)return`${s}s ago`;if(s<3600)return`${Math.floor(s/60)}m ago`;return`${Math.floor(s/3600)}h ago`};
    function render(){const q=search.value.trim().toLowerCase(), visible=checks.filter(c=>`${c.name} ${c.id} ${c.type}`.toLowerCase().includes(q));grid.innerHTML=visible.length?visible.map(c=>`<article class="card ${esc(c.status)}"><div class="top"><div><div class="name">${esc(c.name)}</div><div class="meta">${esc(c.id)} · ${esc(c.type)}</div></div><span class="badge">${esc(c.status).toUpperCase()}</span></div><div class="latency">${c.started_at?Number(c.duration_ms).toFixed(1):'–'} <small>ms</small></div><div class="details"><span>Checked ${age(c.started_at)}</span><span>${c.consecutive_failures||0} consecutive failures</span></div>${c.error?`<div class="error-text">${esc(c.error)}</div>`:''}</article>`).join(''):'<div class="empty">No checks match this filter.</div>'}
    async function refresh(){try{const r=await fetch('/api/v1/status',{cache:'no-store'});if(!r.ok)throw new Error(`HTTP ${r.status}`);const d=await r.json();checks=d.checks||[];document.querySelector('#version').textContent=`v${d.version} · live`;document.querySelector('#total').textContent=d.summary.total;document.querySelector('#ok').textContent=d.summary.ok;document.querySelector('#error').textContent=d.summary.error;document.querySelector('#other').textContent=d.summary.unknown+d.summary.disabled;document.querySelector('#updated').textContent=`Updated ${new Date().toLocaleTimeString()}`;render()}catch(e){document.querySelector('#version').textContent='API unavailable';grid.innerHTML=`<div class="empty">Unable to load status: ${esc(e.message)}</div>`}}
    search.addEventListener('input',render);refresh();setInterval(refresh,5000);
  </script>
</body>
</html>
